<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101820">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LiftNote">
    <meta name="description" content="iPhoneで使いやすい筋トレ記録メモアプリ。種目、重量、回数、セット、休憩タイマー、履歴を端末内に保存します。">
    <title>LiftNote | 筋トレメモ</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-label="LiftNote 筋トレメモアプリ">
      <header class="topbar">
        <div>
          <p class="date-label" id="todayLabel"></p>
          <h1>LiftNote</h1>
        </div>
        <div class="top-actions">
          <span class="connection-pill" id="connectionStatus">確認中</span>
          <button class="icon-button" id="importButton" type="button" aria-label="記録を読み込む">↑</button>
          <button class="icon-button" id="exportButton" type="button" aria-label="記録を書き出す">↓</button>
          <input class="visually-hidden" id="importFile" type="file" accept="application/json,.json">
        </div>
      </header>

      <section class="summary-strip" aria-label="今日の概要">
        <div>
          <span class="metric-value" id="totalSets">0</span>
          <span class="metric-label">sets</span>
        </div>
        <div>
          <span class="metric-value" id="totalVolume">0kg</span>
          <span class="metric-label">volume</span>
        </div>
        <div>
          <span class="metric-value" id="sessionTime">0m</span>
          <span class="metric-label">time</span>
        </div>
      </section>

      <nav class="tabs" aria-label="表示切り替え">
        <button class="tab is-active" type="button" data-view="workout">今日</button>
        <button class="tab" type="button" data-view="history">履歴</button>
        <button class="tab" type="button" data-view="library">種目</button>
      </nav>

      <section class="view is-active" id="workoutView" aria-labelledby="workoutTitle">
        <div class="section-heading">
          <h2 id="workoutTitle">今日のメニュー</h2>
          <button class="text-button" id="finishWorkout" type="button">完了</button>
        </div>

        <form class="entry-form" id="setForm">
          <label>
            <span>種目</span>
            <input id="exerciseInput" name="exercise" list="exerciseList" autocomplete="off" placeholder="ベンチプレス" required>
          </label>
          <datalist id="exerciseList"></datalist>
          <div class="form-row">
            <label>
              <span>重量 kg</span>
              <input id="weightInput" name="weight" inputmode="decimal" type="number" min="0" step="0.5" placeholder="60">
            </label>
            <label>
              <span>回数</span>
              <input id="repsInput" name="reps" inputmode="numeric" type="number" min="1" step="1" placeholder="10" required>
            </label>
          </div>
          <label>
            <span>メモ</span>
            <textarea id="noteInput" name="note" rows="2" placeholder="フォーム、きつさ、痛みなど"></textarea>
          </label>
          <button class="primary-button" type="submit">セットを追加</button>
        </form>

        <div class="timer-panel" aria-live="polite">
          <div>
            <span class="timer-label">休憩</span>
            <strong id="timerDisplay">01:30</strong>
          </div>
          <div class="timer-actions">
            <button type="button" data-rest="60">1:00</button>
            <button type="button" data-rest="90">1:30</button>
            <button type="button" data-rest="180">3:00</button>
            <button type="button" id="timerToggle">開始</button>
          </div>
        </div>

        <div class="set-list" id="setList"></div>
      </section>

      <section class="view" id="historyView" aria-labelledby="historyTitle">
        <div class="section-heading">
          <h2 id="historyTitle">履歴</h2>
          <button class="text-button danger" id="clearAll" type="button">全削除</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </section>

      <section class="view" id="libraryView" aria-labelledby="libraryTitle">
        <div class="section-heading">
          <h2 id="libraryTitle">種目テンプレ</h2>
          <button class="text-button" id="resetLibrary" type="button">初期化</button>
        </div>
        <form class="library-form" id="libraryForm">
          <input id="newExerciseInput" autocomplete="off" placeholder="新しい種目を追加" required>
          <button class="icon-button dark" type="submit" aria-label="追加">＋</button>
        </form>
        <div class="exercise-cloud" id="exerciseCloud"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
